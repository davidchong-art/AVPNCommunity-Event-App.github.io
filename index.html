      width: size,
      height: size,
      viewBox: '0 0 24 24',
      fill: 'none',
      stroke,
      strokeWidth,
      strokeLinecap: 'round',
      strokeLinejoin: 'round',
      className,
      style,

}

function Avatar({ initials, accent = '#0F5F4D', size = 40, online = false, ring = false, src, logoMode = false }) {

  const showImg = src && !imgErr;
  return (
    <div className="relative flex-shrink-0" style={{ width: size, height: size }}>
      <div
        className="w-full h-full rounded-full flex items-center justify-center text-white font-medium overflow-hidden"
        style={{
          background: showImg && logoMode ? '#FFFFFF' : `linear-gradient(135deg, ${accent} 0%, ${accent}cc 100%)`,
          fontSize: size * 0.36,
          letterSpacing: '0.02em',
          boxShadow: ring ? `0 0 0 2px ${C.gold}` : 'none',
          padding: showImg && logoMode ? Math.round(size * 0.12) : 0,
        }}>
        {showImg
          ? <img src={src} alt={initials} onError={() => setImgErr(true)}
              style={{ width: '100%', height: '100%', objectFit: logoMode ? 'contain' : 'cover', borderRadius: logoMode ? 0 : '50%' }} />
          : initials

// QR pass overlay

function QRPass({ onClose }) {
  // build a fake QR-ish pattern
  const cells = React.useMemo(() => {
    const grid = [];
    const N = 25;
    // deterministic pseudo-random
    let seed = 7;
    const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    for (let y = 0; y < N; y++) {
      const row = [];
      for (let x = 0; x < N; x++) {
        // corner finders
        const corner = (x < 7 && y < 7) || (x >= N - 7 && y < 7) || (x < 7 && y >= N - 7);
        if (corner) {
          const cx = x < 7 ? x : N - 1 - x;
          const cy = y < 7 ? y : N - 1 - y;
          const inOuter = cx === 0 || cx === 6 || cy === 0 || cy === 6;
          const inInner = cx >= 2 && cx <= 4 && cy >= 2 && cy <= 4;
          row.push(inOuter || inInner ? 1 : 0);
        } else {
          row.push(rand() > 0.55 ? 1 : 0);
        }
      }
      grid.push(row);
    }
    return grid;
  }, []);

  return (
    <div className="absolute inset-0 z-50 flex items-center justify-center" style={{ background: 'rgba(11, 31, 26, 0.7)' }}>
      <div className="mx-5 rounded-3xl overflow-hidden w-[88%] relative" style={{ background: '#fff', border: `1px solid ${C.line}` }}>
        {/* header */}
        <div className="p-4 relative" style={{ background: C.ink, color: '#fff' }}>
          <button onClick={onClose} className="absolute top-3 right-3 w-7 h-7 rounded-full flex items-center justify-center" style={{ background: 'rgba(255,255,255,0.1)' }}>
            <Icon name="X" size={14} />
          </button>
          <div className="text-[10px] uppercase tracking-[0.18em] font-semibold" style={{ color: C.gold }}>AVPN Global · Day 1</div>
          <div className="text-[15.5px] font-semibold mt-0.5">Belinda Tanoto</div>
          <div className="text-[11px] text-white/55">Trustee · Tanoto Foundation</div>
        </div>

        {/* QR */}
        <div className="p-5 flex flex-col items-center">
          <div className="p-3.5 rounded-2xl" style={{ background: '#fff', border: `2px solid ${C.gold}` }}>
            <svg width="180" height="180" viewBox="0 0 25 25" shapeRendering="crispEdges">
              {cells.map((row, y) => row.map((c, x) => c ? (
                <rect key={`${x}-${y}`} x={x} y={y} width={1} height={1} fill={C.ink} />
              ) : null))}
              {/* center logo */}
              <rect x={10} y={10} width={5} height={5} fill="#fff" />
              <rect x={11} y={11} width={3} height={3} fill={C.primary} />
            </svg>
          </div>
          <div className="text-[11px] mt-3 text-center" style={{ color: C.ink3 }}>
            Scan at session doors for entry, or<br/>tap-to-share for lead exchange
          </div>
        </div>

        {/* actions */}
        <div className="px-5 pb-5 grid grid-cols-3 gap-2">
          {[
            { ic: 'Nfc', l: 'Tap NFC' },
            { ic: 'ScanLine', l: 'Scan badge' },
            { ic: 'Download', l: 'Save pass' },
          ].map(a => (
            <button key={a.l} className="flex flex-col items-center gap-1.5 py-3 rounded-xl"
                    style={{ background: '#FAF6F4', border: `1px solid ${C.line}` }}>
              <Icon name={a.ic} size={18} stroke={C.primary} />
              <div className="text-[10.5px] font-medium" style={{ color: C.ink }}>{a.l}</div>
            </button>
          ))}
        </div>

        {/* footer */}
        <div className="px-5 py-3 flex items-center justify-between text-[10.5px]"
             style={{ background: '#FAF0EE', borderTop: `1px solid ${C.line}`, color: C.ink3 }}>
          <span><Icon name="ShieldCheck" size={11} className="inline mr-1 -mt-0.5" /> Verified Premier</span>
          <span>ID: AVPN-26-04812</span>
        </div>
      </div>
    </div>
  );
}
